services:
  - type: web
    name: albatha-mpc-backend
    runtime: docker
    dockerfilePath: ./poc-app/backend/Dockerfile
    dockerContext: ./poc-app/backend
    plan: free
    envVars:
      # "mock" replays seeded results (no API cost); switch to "live" and
      # set ANTHROPIC_API_KEY below to enable the invoice-OCR AI-vision
      # fallback. Item-photo extraction never needs this either way.
      - key: EXTRACTION_MODE
        value: mock
      # Set this once the Vercel frontend has a URL, e.g.
      # https://albatha-mpc.vercel.app — comma-separate multiple origins.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Gemini vision (box counting/cross-check on real scans - see
      # app/services/gemini_extraction.py). Routed through the company LLM
      # gateway, not Google's public API directly - set GEMINI_BASE_URL to
      # that gateway's URL alongside the key issued for it. Required for
      # real (non-mock) item-photo scans to work at all in production.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        sync: false
