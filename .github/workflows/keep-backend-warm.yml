name: Keep Render backend warm

# Render's free plan spins the backend down after ~15 minutes of
# inactivity; the next real request then has to wait 50+ seconds (or, for
# a heavier real-scan request, can time out entirely - see Claude.md) while
# it wakes back up. This just pings the health endpoint often enough that
# it never gets the chance to go to sleep, so a demo link always responds
# immediately. Costs nothing beyond a sliver of GitHub Actions' free
# monthly minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # 90s, not 30s - the very first ping after a real cold spin-down
        # (or after this workflow's own gaps) needs to survive Render's
        # full wake-up time, or it just times out (exit 28) without ever
        # actually finishing the wake-up - which then leaves the backend
        # cold for the next cycle too, instead of fixing itself.
        run: curl -sf --max-time 90 https://albatha-mpc-backend.onrender.com/api/health
